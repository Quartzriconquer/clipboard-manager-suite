<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="55%" stop-color="#221347"/>
      <stop offset="100%" stop-color="#0f0a24"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2a78"/>
      <stop offset="100%" stop-color="#2a1c56"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3596"/>
      <stop offset="100%" stop-color="#312368"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f43b8"/>
      <stop offset="100%" stop-color="#3d2c82"/>
    </linearGradient>
    <linearGradient id="glowline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f7bf5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8f7bf5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8f7bf5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cf0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfc3ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="960" cy="150" r="240" fill="url(#glow)"/>
  <circle cx="1080" cy="300" r="140" fill="url(#glow)"/>

  <g opacity="0.12" stroke="#a893ff" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="320"/>
    <line x1="160" y1="40" x2="160" y2="320"/>
    <line x1="260" y1="40" x2="260" y2="320"/>
  </g>

  <!-- sync arrows top -->
  <g stroke="#8f7bf5" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 700 55 A 40 40 0 1 1 700 100" />
    <polygon points="700,50 708,62 692,62" fill="#8f7bf5"/>
  </g>

  <!-- stacked clipboard cards -->
  <g>
    <rect x="900" y="150" width="220" height="130" rx="14" fill="url(#card1)" opacity="0.7" transform="rotate(-8 900 150)"/>
    <rect x="870" y="120" width="230" height="140" rx="14" fill="url(#card2)" opacity="0.85" transform="rotate(-4 870 120)"/>
    <rect x="845" y="88" width="245" height="150" rx="16" fill="url(#card3)" stroke="#c3b3ff" stroke-width="1.5"/>
    <!-- clip on top card -->
    <rect x="940" y="78" width="55" height="26" rx="8" fill="#241a4d" stroke="#c3b3ff" stroke-width="1.5"/>
    <!-- text lines on card -->
    <rect x="870" y="130" width="180" height="10" rx="5" fill="#cfc3ff" opacity="0.8"/>
    <rect x="870" y="150" width="140" height="10" rx="5" fill="#cfc3ff" opacity="0.55"/>
    <rect x="870" y="170" width="160" height="10" rx="5" fill="#cfc3ff" opacity="0.4"/>
    <!-- tag chips -->
    <rect x="870" y="196" width="58" height="22" rx="11" fill="#3ee0c8" opacity="0.85"/>
    <text x="899" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0f0a24" text-anchor="middle">#link</text>
    <rect x="936" y="196" width="66" height="22" rx="11" fill="#f5a35c" opacity="0.85"/>
    <text x="969" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0f0a24" text-anchor="middle">#code</text>
    <rect x="1010" y="196" width="60" height="22" rx="11" fill="#ff7bc0" opacity="0.85"/>
    <text x="1040" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0f0a24" text-anchor="middle">#note</text>
  </g>

  <!-- small floating chips lower right for history depth -->
  <g opacity="0.55">
    <rect x="1010" y="260" width="150" height="42" rx="10" fill="#2a1c56" stroke="#8f7bf5" stroke-width="1"/>
    <rect x="1024" y="272" width="90" height="8" rx="4" fill="#cfc3ff" opacity="0.7"/>
    <rect x="1024" y="286" width="60" height="8" rx="4" fill="#cfc3ff" opacity="0.4"/>
  </g>

  <!-- connecting sync dashes between cards -->
  <g stroke="#8f7bf5" stroke-width="2" stroke-dasharray="4 5" opacity="0.5">
    <line x1="845" y1="230" x2="900" y2="150"/>
    <line x1="960" y1="238" x2="1020" y2="260"/>
  </g>

  <line x1="60" y1="248" x2="700" y2="248" stroke="url(#glowline)" stroke-width="1.5"/>

  <text x="60" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#headGrad)">
    <tspan x="60" y="170" textLength="820" lengthAdjust="spacingAndGlyphs">Clipboard Manager</tspan>
    <tspan x="60" y="240" textLength="360" lengthAdjust="spacingAndGlyphs">Extended</tspan>
  </text>

  <text x="60" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#c9bef0" opacity="0.92">
    <tspan x="60" y="285" textLength="900" lengthAdjust="spacingAndGlyphs">Built for devs who need instant access to clipboard history with</tspan>
    <tspan x="60" y="313" textLength="380" lengthAdjust="spacingAndGlyphs">tagging and sync support</tspan>
  </text>
</svg>